# Runs the test suite and a pipeline smoke test on every push and pull request.
# GitHub only picks up workflows from .github/ at the repository root, so this
# lives here and points at the project/ folder.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v

      - name: Smoke-test the pipeline end to end
        # A FAIL verdict exits 1 by design, so '|| true' keeps this step about
        # whether the pipeline runs, not whether this dataset passes.
        run: |
          python modules/m4_pipeline/pipeline.py \
            --input data/raw/broadband_customers.csv \
            --no-figures --quiet || true
