# =============================================================================
# CI — run the test suite on every push and pull request
# =============================================================================
# Free on GitHub for public repositories. Its job is simple: nobody merges code
# that breaks the tests, including me.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v

      - name: Smoke-test the pipeline end to end
        run: |
          python modules/m4_pipeline/pipeline.py \
            --input data/raw/broadband_customers.csv \
            --no-figures --quiet || true
        # '|| true' because a FAIL verdict is exit 1 by design — here we only
        # care that the pipeline RUNS, not that this dataset passes.