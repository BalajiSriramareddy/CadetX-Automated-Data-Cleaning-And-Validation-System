# =============================================================================
# pipeline_config.yaml â€” PIPELINE SETTINGS
# =============================================================================
paths:
  input: data/raw/broadband_customers.csv
  output_dir: outputs
  processed_dir: data/processed
  log_dir: logs
  rules_file: modules/m3_validation/rules.yaml

profiling:
  generate_figures: true
  figures_subdir: figures

cleaning:
  # advanced/optional steps â€” all OFF by default (see clean.py docstring for why)
  fuzzy_duplicate_check: false   # flags candidate near-duplicate names for review
  ml_imputation: null             # null | "knn" | "regression" | "iterative"
  infer_schema: true              # cheap and useful â€” on by default
  transform: false                # scaling/encoding/features; only needed for ML use

validation:
  contamination: 0.05
  apply_declared_rules: true
  # advanced/optional anomaly & AI checks â€” all OFF by default
  local_outlier_factor: false
  autoencoder: false
  nlp_classifier: false
  ai_error_detection: false
  data_drift: false                # requires a reference dataset (not set here)
  evaluate: false                  # requires known ground-truth anomaly rows

thresholds:
  pass_score: 90
  warning_score: 70
  fail_on_verdict_fail: true

logging:
  verbose: true